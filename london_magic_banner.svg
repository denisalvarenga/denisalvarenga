<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0018"/>
      <stop offset="45%" stop-color="#2D1145"/>
      <stop offset="100%" stop-color="#4A1D7A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B784FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B784FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8D5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8D5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#E8D5FF">
    <circle cx="90" cy="35" r="1.6"/>
    <circle cx="240" cy="25" r="1.2"/>
    <circle cx="470" cy="45" r="1.8"/>
    <circle cx="610" cy="20" r="1.3"/>
    <circle cx="760" cy="55" r="1.5"/>
    <circle cx="900" cy="30" r="1.4"/>
    <circle cx="150" cy="70" r="1.1"/>
    <circle cx="520" cy="80" r="1.2"/>
    <circle cx="680" cy="90" r="1.6"/>
    <circle cx="1150" cy="60" r="1.3"/>
    <circle cx="1010" cy="90" r="1.2"/>
  </g>

  <!-- moon (crescent) -->
  <circle cx="1085" cy="65" r="55" fill="url(#moonGlow)"/>
  <circle cx="1085" cy="65" r="32" fill="#EFE1FF"/>
  <circle cx="1100" cy="55" r="30" fill="#0D0018"/>

  <!-- owl silhouette (a wink at Hogwarts mail) -->
  <g transform="translate(560,95)">
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#3D1E6D"/>
    <path d="M -14 -6 Q -34 -18 -30 6 Q -18 2 -14 -6 Z" fill="#3D1E6D"/>
    <path d="M 14 -6 Q 34 -18 30 6 Q 18 2 14 -6 Z" fill="#3D1E6D"/>
    <circle cx="-5" cy="-4" r="3.4" fill="#B784FF"/>
    <circle cx="5" cy="-4" r="3.4" fill="#B784FF"/>
    <polygon points="0,0 -3,5 3,5" fill="#E8D5FF"/>
  </g>

  <!-- wand sparkle trail -->
  <g stroke="#B784FF" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 605 130 L 660 150" />
  </g>
  <g fill="#E8D5FF">
    <circle cx="670" cy="153" r="2.2"/>
    <circle cx="682" cy="146" r="1.6"/>
    <circle cx="660" cy="138" r="1.3"/>
    <path d="M 690 158 l 3 6 l 6 3 l -6 3 l -3 6 l -3 -6 l -6 -3 l 6 -3 z" fill="#B784FF"/>
  </g>

  <!-- distant skyline silhouette -->
  <g fill="#180A2E">
    <rect x="0" y="255" width="1200" height="65"/>
    <rect x="20" y="230" width="26" height="30"/>
    <rect x="70" y="220" width="20" height="40"/>
    <rect x="400" y="225" width="22" height="35"/>
    <rect x="470" y="215" width="18" height="45"/>
    <rect x="760" y="225" width="24" height="35"/>
    <rect x="940" y="215" width="20" height="45"/>
    <rect x="1000" y="230" width="26" height="30"/>
    <rect x="1120" y="220" width="22" height="40"/>
  </g>

  <!-- London Eye -->
  <g transform="translate(300,235)">
    <circle r="95" fill="none" stroke="#7C3AED" stroke-width="6"/>
    <circle r="95" fill="none" stroke="#B784FF" stroke-width="1.5" stroke-opacity="0.6"/>
    <g stroke="#7C3AED" stroke-width="2">
      <line x1="-95" y1="0" x2="95" y2="0"/>
      <line x1="0" y1="-95" x2="0" y2="95"/>
      <line x1="-67" y1="-67" x2="67" y2="67"/>
      <line x1="-67" y1="67" x2="67" y2="-67"/>
    </g>
    <g fill="#B784FF">
      <circle cx="95" cy="0" r="6"/>
      <circle cx="-95" cy="0" r="6"/>
      <circle cx="0" cy="95" r="6"/>
      <circle cx="0" cy="-95" r="6"/>
      <circle cx="67" cy="67" r="6"/>
      <circle cx="-67" cy="67" r="6"/>
      <circle cx="67" cy="-67" r="6"/>
      <circle cx="-67" cy="-67" r="6"/>
    </g>
    <rect x="-8" y="90" width="16" height="42" fill="#4A1D7A"/>
    <line x1="-30" y1="132" x2="30" y2="132" stroke="#4A1D7A" stroke-width="8"/>
  </g>

  <!-- Big Ben tower -->
  <g transform="translate(560,0)">
    <rect x="0" y="70" width="70" height="190" fill="#3D1E6D"/>
    <rect x="-6" y="70" width="82" height="14" fill="#2D1145"/>
    <polygon points="-10,70 80,70 60,20 10,20" fill="#4A1D7A"/>
    <polygon points="15,20 55,20 35,-10" fill="#7C3AED"/>
    <circle cx="35" cy="55" r="26" fill="#12001F" stroke="#B784FF" stroke-width="3"/>
    <line x1="35" y1="55" x2="35" y2="38" stroke="#E8D5FF" stroke-width="2.5"/>
    <line x1="35" y1="55" x2="49" y2="55" stroke="#E8D5FF" stroke-width="2.5"/>
    <g fill="#1A0B2E">
      <rect x="14" y="100" width="12" height="20"/>
      <rect x="44" y="100" width="12" height="20"/>
      <rect x="14" y="135" width="12" height="20"/>
      <rect x="44" y="135" width="12" height="20"/>
      <rect x="14" y="170" width="12" height="20"/>
      <rect x="44" y="170" width="12" height="20"/>
      <rect x="14" y="205" width="12" height="20"/>
      <rect x="44" y="205" width="12" height="20"/>
    </g>
  </g>

  <!-- red telephone box, reimagined in purple -->
  <g transform="translate(760,175)">
    <rect x="0" y="0" width="46" height="85" fill="#6D28D9"/>
    <rect x="-4" y="-8" width="54" height="10" fill="#5B2A86"/>
    <g fill="#12001F">
      <rect x="6" y="10" width="12" height="16"/>
      <rect x="28" y="10" width="12" height="16"/>
      <rect x="6" y="32" width="12" height="16"/>
      <rect x="28" y="32" width="12" height="16"/>
      <rect x="6" y="54" width="34" height="20"/>
    </g>
  </g>

  <!-- Underground-style roundel (generic nod, not the official mark) -->
  <g transform="translate(870,220)">
    <circle r="26" fill="none" stroke="#B784FF" stroke-width="7"/>
    <rect x="-30" y="-5" width="60" height="10" fill="#7C3AED"/>
  </g>

  <!-- Platform 9 3/4 signpost -->
  <g transform="translate(960,190)">
    <rect x="-2" y="0" width="4" height="70" fill="#4A1D7A"/>
    <rect x="-38" y="-18" width="76" height="26" rx="3" fill="#2D1145" stroke="#B784FF" stroke-width="2"/>
    <text x="0" y="1" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#E8D5FF">9¾</text>
  </g>

  <!-- soft light streak across scene -->
  <rect x="0" y="150" width="500" height="2" fill="url(#glow)" opacity="0.4"/>

  <!-- Thames -->
  <path d="M 0 300 Q 150 285 300 300 T 600 300 T 900 300 T 1200 300 L 1200 320 L 0 320 Z" fill="#1A0B2E"/>
  <path d="M 0 300 Q 150 285 300 300 T 600 300 T 900 300 T 1200 300" fill="none" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.5"/>
</svg>
